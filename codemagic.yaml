workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      groups:
        - keystore_credentials
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Install Gradle Wrapper
        script: |
          gradle wrapper --gradle-version 8.4
      - name: Decrypt and Inject Release Keystore
        script: |
          # 1. Reconstrói o arquivo físico usando o texto Base64 do painel
          echo "$CM_KEYSTORE_BASE64" | base64 --decode > "app/$CM_KEY_PATH"
          
          # 2. Injeta os dados da sua chave definitiva no gradle.properties
          echo "RELEASE_STORE_FILE=$CM_KEY_PATH" >> app/gradle.properties
          echo "RELEASE_STORE_PASSWORD=$CM_KEY_PASSWORD" >> app/gradle.properties
          echo "RELEASE_KEY_ALIAS=$CM_KEY_ALIAS" >> app/gradle.properties
          echo "RELEASE_KEY_PASSWORD=$CM_KEY_PASSWORD" >> app/gradle.properties
      - name: Build Android App Bundle (AAB)
        script: |
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/bundle/release/*.aab
